name: Release Obsidian plugin

on:
  push:
    tags:
      - "[0-9]*.[0-9]*.[0-9]*"

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Svelte check
        run: npm run check:svelte

      - name: Type check
        run: npm run check

      - name: Build
        run: npm run build

      - name: Test
        run: npm test

      - name: Validate release metadata
        env:
          TAG: ${{ github.ref_name }}
        run: npm run release:check -- "$TAG"

      - name: Generate artifact attestations
        uses: actions/attest@v4
        with:
          subject-path: |
            main.js
            manifest.json
            styles.css
            LICENSE
            THIRD_PARTY_NOTICES

      - name: Create release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          cat > "$RUNNER_TEMP/release-license-notes.md" <<EOF
          Licensed under GNU GPL version 3 only (GPL-3.0-only). See the attached LICENSE and THIRD_PARTY_NOTICES.

          Corresponding source: [source archive](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/archive/refs/tags/${TAG}.zip).
          Build instructions: [README](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/blob/${TAG}/README.md#development).

          Previously published releases through 1.4.2 retain their original MIT License.
          EOF
          gh release create "$TAG" --title "$TAG" --generate-notes \
            --notes-file "$RUNNER_TEMP/release-license-notes.md" \
            main.js manifest.json styles.css LICENSE THIRD_PARTY_NOTICES
